<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            font-size: 16px;
        }

        .container{
            padding: 20px;
        }

        h1{
            font-size: 36px;
            line-height: 1.2;
        }

        h2{
            font-size: 1.5em;
            line-height: 1.4;
            color: gray;
            font-weight: bold;
        }

        p{
            font-size: 1rem;
            line-height: 1.6;
            color: lightslategray;
        }

        .highlight{
            background-color: lightpink;
            color: crimson;
            padding: 0 4px;
            border-radius: 3px;
            font-size: 2em;
            font-weight: bold;
        }

        hr{
            height: 2px;
            background-color: black;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Main Heading with Pixels</h1>
        <hr>
        <h2>Subheading with Ems</h2>
        <p>Body text using rems...</p>
        <p>Text with <span class="highlight">highlighted content</span> using ems.</p>
    </div>

</body>
</html>
